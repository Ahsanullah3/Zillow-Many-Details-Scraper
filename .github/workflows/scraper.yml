name: 🚀 Chrome Stealth Scraper (CDP)

run-name: 🚀 Chrome Stealth Scraper CDP (Batch ${{ inputs.batch || '1' }})

on:
  workflow_dispatch:
    inputs:
      batch:
        description: "Batch number"
        required: false
        default: "1"
        type: string
      debug_dump:
        description: "Save debug files (1 = yes)"
        required: false
        default: "0"
        type: string

permissions:
  actions: write
  contents: read

concurrency:
  group: zillow-scraper
  cancel-in-progress: false

env:
  MAX_BATCHES: '60'
  MAX_SKIP_STREAK: '15'

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    outputs:
      has_more: ${{ steps.scraper_task.outputs.has_more }}
      blocked:  ${{ steps.scraper_task.outputs.blocked }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install ngrok and jq
        run: |
          # Install jq (for parsing ngrok API JSON)
          sudo apt-get update -qq
          sudo apt-get install -y -qq jq

          # Install ngrok
          curl -s https://ngrok-agent.s3.amazonaws.com/ngrok.asc | sudo tee /etc/apt/trusted.gpg.d/ngrok.asc >/dev/null
          echo "deb https://ngrok-agent.s3.amazonaws.com buster main" | sudo tee /etc/apt/sources.list.d/ngrok.list
          sudo apt-get update -qq && sudo apt-get install -y -qq ngrok

      - name: Cache Puppeteer Chrome
        uses: actions/cache@v4
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-${{ runner.os }}-${{ hashFiles('package.json', 'package-lock.json') }}

      - name: Install Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Check system Chrome
        run: google-chrome --version

      - name: Start Xvfb (virtual display for headful Chrome)
        run: |
          Xvfb :99 -screen 0 1400x900x24 &
          sleep 2
          echo "DISPLAY=:99" >> $GITHUB_ENV

      - name: Start ngrok tunnel for CDP port 9222
        id: ngrok
        run: |
          ngrok config add-authtoken ${{ secrets.NGROK_AUTH_TOKEN }}
          ngrok tcp 9222 --log=stdout > /tmp/ngrok.log 2>&1 &

          # Wait up to 30 seconds for the tunnel to appear in the local ngrok API
          NGROK_ADDR=""
          for i in {1..30}; do
            sleep 1
            NGROK_ADDR=$(curl -s http://127.0.0.1:4040/api/tunnels | jq -r '.tunnels[0].public_url' 2>/dev/null | sed 's|tcp://||')
            if [ -n "$NGROK_ADDR" ] && [ "$NGROK_ADDR" != "null" ]; then
              break
            fi
          done

          if [ -z "$NGROK_ADDR" ] || [ "$NGROK_ADDR" = "null" ]; then
            echo "❌ Failed to get ngrok URL after 30 seconds. Dumping log:"
            cat /tmp/ngrok.log
            exit 1
          fi

          echo "CDP_ADDRESS=$NGROK_ADDR" >> $GITHUB_OUTPUT
          echo ""
          echo "=========================================="
          echo "🔗 CDP Address: $NGROK_ADDR"
          echo ""
          echo "📋 To solve CAPTCHAs:"
          echo "  1. Open Chrome on your laptop"
          echo "  2. Go to: http://$NGROK_ADDR"
          echo "  3. Find the Zillow tab"
          echo "  4. Press & Hold to solve"
          echo "=========================================="
          echo ""

      - name: Run Scraper (with CDP access)
        id: scraper_task
        run: node index.js
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          HEADFUL: '1'
          CHROME_PATH: /usr/bin/google-chrome
          CONCURRENCY: '1'
          MAX_URLS_PER_RUN: '3000'
          BLOCK_RESOURCES: '0'
          INCLUDE_PAGE_TEXT: '1'
          RETRY_BLOCKED: '1'
          MAX_BLOCK_STREAK: '6'
          MAX_SKIP_STREAK: '15'
          FINANCIAL_WAIT_MS: '12000'
          FINANCIAL_RELOAD_WAIT_MS: '15000'
          CDP_CAPTCHA_WAIT_MS: '300000'
          DEBUG_DUMP: ${{ inputs.debug_dump || '0' }}

      - name: Upload debug files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-batch-${{ inputs.batch || '1' }}
          path: debug/
          if-no-files-found: ignore

      - name: Evaluate Self-Reboot
        if: |
          !cancelled() &&
          steps.scraper_task.outputs.has_more == 'true' &&
          steps.scraper_task.outputs.blocked != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CURRENT_BATCH="${{ inputs.batch || '1' }}"
          NEXT_BATCH=$((CURRENT_BATCH + 1))
          if [ "$NEXT_BATCH" -gt "$MAX_BATCHES" ]; then
            echo "Reached MAX_BATCHES ($MAX_BATCHES) — stopping."
            exit 0
          fi
          echo "Batch $CURRENT_BATCH hit threshold. Triggering Batch $NEXT_BATCH..."
          gh workflow run scraper.yml --ref main -f batch="$NEXT_BATCH"
          sleep 5

      - name: Cleanup on Cancel
        if: cancelled()
        run: |
          echo "🛑 Workflow was cancelled — self-reboot skipped."
