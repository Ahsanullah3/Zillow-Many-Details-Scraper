name: 🚀 Edge Scraper V6

run-name: 🚀 Edge Scraper V6 (Batch ${{ inputs.batch || '1' }})

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:
    inputs:
      batch:
        description: "Batch number"
        required: false
        default: "1"
        type: string
      blocks:
        description: "Consecutive blocked batches"
        required: false
        default: "0"
        type: string

permissions:
  actions: write
  contents: read

concurrency:
  group: zillow-scraper
  cancel-in-progress: false

env:
  MAX_BATCHES: "40"            # hard cap on the whole chain
  MAX_CONSECUTIVE_BLOCKS: "6"  # stop after this many blocked batches in a row

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Setup Edge (Latest Dev)
        id: setup-edge
        uses: browser-actions/setup-edge@v1
        with:
          edge-version: 'dev'

      - name: Run Scraper
        id: scraper_task
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          PUPPETEER_EXECUTABLE_PATH: ${{ steps.setup-edge.outputs.edge-path }}
          BATCH_NUMBER: ${{ inputs.batch || '1' }}
        run: npm start

      # Runs ONLY if the job is healthy: not cancelled, not failed,
      # not timed out, and the scraper reported more rows.
      - name: Evaluate Self-Reboot
        if: ${{ !cancelled() && success() && steps.scraper_task.outputs.has_more == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CURRENT_BATCH: ${{ inputs.batch || '1' }}
          CURRENT_BLOCKS: ${{ inputs.blocks || '0' }}
          WAS_BLOCKED: ${{ steps.scraper_task.outputs.blocked }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if ! [[ "$CURRENT_BATCH" =~ ^[0-9]+$ ]]; then CURRENT_BATCH=1; fi
          if ! [[ "$CURRENT_BLOCKS" =~ ^[0-9]+$ ]]; then CURRENT_BLOCKS=0; fi
          NEXT_BATCH=$((CURRENT_BATCH + 1))

          if [ "$NEXT_BATCH" -gt "$MAX_BATCHES" ]; then
            echo "Reached MAX_BATCHES ($MAX_BATCHES). Stopping; cron will resume later."
            exit 0
          fi

          # Blocked -> retry immediately (new runner = new IP), but cap consecutive blocks
          if [ "$WAS_BLOCKED" = "true" ]; then
            NEXT_BLOCKS=$((CURRENT_BLOCKS + 1))
            if [ "$NEXT_BLOCKS" -ge "$MAX_CONSECUTIVE_BLOCKS" ]; then
              echo "Blocked $NEXT_BLOCKS batches in a row — stopping. Cron will retry later."
              exit 0
            fi
            echo "Blocked — starting next batch immediately on a fresh runner ($NEXT_BLOCKS in a row)"
          else
            NEXT_BLOCKS=0
          fi

          echo "Batch $CURRENT_BATCH → Batch $NEXT_BATCH"
          gh workflow run scraper.yml --ref "$REF_NAME" -f batch="$NEXT_BATCH" -f blocks="$NEXT_BLOCKS"
