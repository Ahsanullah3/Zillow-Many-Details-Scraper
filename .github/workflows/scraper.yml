name: 🚀 Stealth Scraper V7

run-name: 🚀 Stealth Scraper V7 (Batch ${{ inputs.batch || '1' }})

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:
    inputs:
      batch:
        description: "The current batch number"
        required: false
        default: "1"
        type: string
      retry_blocked:
        description: "Retry rows marked blocked/error (this run only, not chained)"
        required: false
        default: "false"
        type: string
      blocks:
        description: "Consecutive blocked batches"
        required: false
        default: "0"
        type: string

permissions:
  actions: write
  contents: read

env:
  MAX_BATCHES: "40"
  MAX_CONSECUTIVE_BLOCKS: "6"

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Setup Google Chrome Build Engine
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Run Scraper Engine
        id: scraper_task
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          RETRY_BLOCKED: ${{ inputs.retry_blocked == 'true' && '1' || '0' }}
        run: npm start

      # Only when healthy: not cancelled/failed/timed out, and more rows remain
      - name: Evaluate Self-Reboot Sequence
        if: ${{ !cancelled() && success() && steps.scraper_task.outputs.has_more == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CURRENT_BATCH: ${{ inputs.batch || '1' }}
          CURRENT_BLOCKS: ${{ inputs.blocks || '0' }}
          WAS_BLOCKED: ${{ steps.scraper_task.outputs.blocked }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if ! [[ "$CURRENT_BATCH" =~ ^[0-9]+$ ]]; then CURRENT_BATCH=1; fi
          if ! [[ "$CURRENT_BLOCKS" =~ ^[0-9]+$ ]]; then CURRENT_BLOCKS=0; fi
          NEXT_BATCH=$((CURRENT_BATCH + 1))

          if [ "$NEXT_BATCH" -gt "$MAX_BATCHES" ]; then
            echo "Reached MAX_BATCHES ($MAX_BATCHES). Stopping; cron resumes later."
            exit 0
          fi

          if [ "$WAS_BLOCKED" = "true" ]; then
            NEXT_BLOCKS=$((CURRENT_BLOCKS + 1))
            if [ "$NEXT_BLOCKS" -ge "$MAX_CONSECUTIVE_BLOCKS" ]; then
              echo "Blocked $NEXT_BLOCKS batches in a row — stopping. Cron retries later."
              exit 0
            fi
          else
            NEXT_BLOCKS=0
          fi

          echo "Batch $CURRENT_BATCH → Batch $NEXT_BATCH"
          gh workflow run scraper.yml --ref "$REF_NAME" -f batch="$NEXT_BATCH" -f blocks="$NEXT_BLOCKS"
          sleep 5
