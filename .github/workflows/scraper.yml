name: 🚀 Edge Scraper V6

run-name: 🚀 Edge Scraper V6 (Batch ${{ inputs.batch || '1' }})

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:
    inputs:
      batch:
        description: "Batch number"
        required: false
        default: "1"
        type: string

permissions:
  actions: write
  contents: read

concurrency:
  group: zillow-scraper
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Setup Edge (Latest Dev)
        id: setup-edge
        uses: browser-actions/setup-edge@v1
        with:
          edge-version: 'dev'

      - name: Run Scraper
        id: scraper_task
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          PUPPETEER_EXECUTABLE_PATH: ${{ steps.setup-edge.outputs.edge-path }}
        run: npm start

      - name: Evaluate Self-Reboot
        if: steps.scraper_task.outputs.has_more == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CURRENT_BATCH="${{ inputs.batch || '1' }}"
          NEXT_BATCH=$((CURRENT_BATCH + 1))
          echo "Batch $CURRENT_BATCH → Batch $NEXT_BATCH"
          gh workflow run scraper.yml --ref main -f batch=$NEXT_BATCH
          sleep 5
