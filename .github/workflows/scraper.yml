name: 🚀 Stealth Scraper V23

run-name: 🚀 Stealth Scraper V23 (Batch ${{ inputs.batch || '1' }})

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:
    inputs:
      batch:
        description: "Current batch number"
        required: false
        default: "1"
        type: string

permissions:
  actions: write
  contents: read

# Prevent overlapping runs (new run cancels old one automatically)
concurrency:
  group: zillow-scraper
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    outputs:
      has_more: ${{ steps.scraper_task.outputs.has_more }}
      blocked:  ${{ steps.scraper_task.outputs.blocked }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Run Scraper Engine
        id: scraper_task
        # 👇 still runs even if the user cancels, so the scraper receives SIGTERM
        # and can flush pending rows before exiting
        continue-on-error: false
        run: npm start
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          CONCURRENCY: '3'
          MAX_URLS_PER_RUN: '150'
          PAGE_ZOOM: '1'
          BLOCK_RESOURCES: '1'
          RETRY_BLOCKED: '1'
          MAX_BLOCK_STREAK: '6'

      # ---- SELF-REBOOT: only if NOT cancelled AND has_more=true ----
      - name: Evaluate Self-Reboot Sequence
        if: |
          !cancelled() &&
          steps.scraper_task.outputs.has_more == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CURRENT_BATCH="${{ inputs.batch || '1' }}"
          NEXT_BATCH=$((CURRENT_BATCH + 1))
          echo "Batch $CURRENT_BATCH hit threshold. Triggering Batch $NEXT_BATCH..."
          gh workflow run scraper.yml --ref main -f batch="$NEXT_BATCH"
          sleep 5

      # ---- CLEAN EXIT: runs even on cancel, logs the stop ----
      - name: Cleanup on Cancel
        if: cancelled()
        run: |
          echo "🛑 Workflow was cancelled — self-reboot skipped."
          echo "   has_more=${{ steps.scraper_task.outputs.has_more }}"
          echo "   blocked=${{ steps.scraper_task.outputs.blocked }}"
