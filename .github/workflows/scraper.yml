name: 🚀 Chrome Stealth Scraper

run-name: 🚀 Chrome Stealth Scraper (Batch ${{ inputs.batch || '1' }})

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:
    inputs:
      batch:
        description: "Current batch number"
        required: false
        default: "1"
        type: string
      debug_dump:
        description: "Save screenshot + HTML when history is missing/blocked (1 = yes)"
        required: false
        default: "0"
        type: string

permissions:
  actions: write
  contents: read

# Cancel-in-progress: true so a cancelled run also kills any queued
# self-reboot. Without this, cancelling Batch N leaves Batch N+1 queued,
# which then starts and keeps the loop alive.
concurrency:
  group: zillow-scraper
  cancel-in-progress: true

env:
  MAX_BATCHES: '60'

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    outputs:
      has_more: ${{ steps.scraper_task.outputs.has_more }}
      blocked:  ${{ steps.scraper_task.outputs.blocked }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache Puppeteer Chrome
        uses: actions/cache@v4
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-${{ runner.os }}-${{ hashFiles('package.json', 'package-lock.json') }}

      - name: Install Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Check system Chrome
        run: google-chrome --version

      # Forward SIGINT/SIGTERM into node so cancellation actually stops
      # the scraper (xvfb-run otherwise swallows the signal).
      - name: Run Scraper Engine (real Chrome, headful under xvfb)
        id: scraper_task
        run: |
          set -e
          xvfb-run -a --server-args="-screen 0 1400x900x24" node index.js &
          CHILD=$!
          trap 'echo "🛑 cancel — forwarding TERM to node"; kill -TERM $CHILD 2>/dev/null; wait $CHILD; exit 143' INT TERM
          wait $CHILD
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          HEADFUL: '1'
          CHROME_PATH: /usr/bin/google-chrome
          CONCURRENCY: '3'
          MAX_URLS_PER_RUN: '150'
          BLOCK_RESOURCES: '1'
          INCLUDE_PAGE_TEXT: '0'
          RETRY_BLOCKED: '1'
          MAX_BLOCK_STREAK: '6'
          DEBUG_DUMP: ${{ inputs.debug_dump || '0' }}

      - name: Upload debug files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-batch-${{ inputs.batch || '1' }}
          path: debug/
          if-no-files-found: ignore

      # Reboot whenever rows remain — INCLUDING when 6-block streak was hit.
      # Guarded by `gh run list` so we don't stack runs if one is already
      # queued (e.g. user cancelled mid-chain).
      - name: Evaluate Self-Reboot Sequence
        if: |
          !cancelled() &&
          steps.scraper_task.outputs.has_more == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ACTIVE=$(gh run list \
            --workflow=scraper.yml \
            --status=queued --status=in_progress \
            --json databaseId --jq 'length')
          if [ "$ACTIVE" -gt 1 ]; then
            echo "Another run already queued/in-progress ($ACTIVE total) — skipping reboot."
            exit 0
          fi

          CURRENT_BATCH="${{ inputs.batch || '1' }}"
          NEXT_BATCH=$((CURRENT_BATCH + 1))

          if [ "$NEXT_BATCH" -gt "$MAX_BATCHES" ]; then
            echo "Reached MAX_BATCHES ($MAX_BATCHES) — not triggering another batch."
            exit 0
          fi

          echo "Batch $CURRENT_BATCH -> triggering Batch $NEXT_BATCH..."
          gh workflow run scraper.yml --ref main -f batch="$NEXT_BATCH"
          sleep 5

      - name: Cleanup on Cancel
        if: cancelled()
        run: |
          echo "🛑 Workflow was cancelled — self-reboot skipped."
