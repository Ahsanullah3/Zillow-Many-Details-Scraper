name: Zillow Scraper

on:
  schedule:
    - cron: '*/15 * * * *'   # every 15 min — guarantees fresh IP/runner
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    outputs:
      has_more: ${{ steps.run.outputs.has_more }}
      blocked:  ${{ steps.run.outputs.blocked }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm ci
      - id: run
        run: node scraper.js
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          SPREADSHEET_ID:          ${{ secrets.SPREADSHEET_ID }}
          PAGE_ZOOM: '0.05'

      # If still blocked after 3 relaunches, re-dispatch immediately
      - name: Re-dispatch if blocked
        if: steps.run.outputs.has_more == 'true' && steps.run.outputs.blocked == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              workflow_id: 'scraper.yml',
              ref:   context.ref.replace('refs/heads/', ''),
            });
