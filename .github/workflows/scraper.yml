name: 🚀 Chrome Stealth Scraper (SSH Debug)

run-name: 🚀 Zillow Scraper (SSH Debug) - Batch ${{ inputs.batch || '1' }}

on:
  workflow_dispatch:
    inputs:
      batch:
        description: "Batch number"
        required: false
        default: "1"
        type: string
      debug_dump:
        description: "Save debug files (1 = yes)"
        required: false
        default: "0"
        type: string

permissions:
  actions: write
  contents: read

concurrency:
  group: zillow-scraper-ssh
  cancel-in-progress: false

env:
  MAX_BATCHES: '60'
  MAX_SKIP_STREAK: '15'

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    outputs:
      has_more: ${{ steps.scraper_task.outputs.has_more }}
      blocked:  ${{ steps.scraper_task.outputs.blocked }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache Puppeteer Chrome
        uses: actions/cache@v4
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-${{ runner.os }}-${{ hashFiles('package.json', 'package-lock.json') }}

      - name: Install Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Check system Chrome
        run: google-chrome --version

      - name: Start Xvfb (virtual display for headful Chrome)
        run: |
          Xvfb :99 -screen 0 1400x900x24 &
          sleep 2
          echo "DISPLAY=:99" >> $GITHUB_ENV

      # -----------------------------------------------------------
      # This is the key step: it opens an SSH session.
      # You will receive an SSH command in the logs.
      # -----------------------------------------------------------
      - name: Setup SSH Debug Session (action-tmate)
        uses: mxschmitt/action-tmate@v3
        with:
          # Keep the session alive for the duration of the job
          limit-access-to-actor: true
        # The session starts immediately. You will see the SSH command
        # in the workflow logs. Keep the session open while the next step runs.

      - name: Run Scraper (with CDP access)
        id: scraper_task
        run: node index.js
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          HEADFUL: '1'
          CHROME_PATH: /usr/bin/google-chrome
          CONCURRENCY: '1'
          MAX_URLS_PER_RUN: '3000'
          BLOCK_RESOURCES: '0'
          INCLUDE_PAGE_TEXT: '1'
          RETRY_BLOCKED: '1'
          MAX_BLOCK_STREAK: '6'
          MAX_SKIP_STREAK: '15'
          FINANCIAL_WAIT_MS: '12000'
          FINANCIAL_RELOAD_WAIT_MS: '15000'
          CDP_CAPTCHA_WAIT_MS: '300000'
          DEBUG_DUMP: ${{ inputs.debug_dump || '0' }}

      - name: Upload debug files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-batch-${{ inputs.batch || '1' }}
          path: debug/
          if-no-files-found: ignore

      - name: Evaluate Self-Reboot
        if: |
          !cancelled() &&
          steps.scraper_task.outputs.has_more == 'true' &&
          steps.scraper_task.outputs.blocked != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CURRENT_BATCH="${{ inputs.batch || '1' }}"
          NEXT_BATCH=$((CURRENT_BATCH + 1))
          if [ "$NEXT_BATCH" -gt "$MAX_BATCHES" ]; then
            echo "Reached MAX_BATCHES ($MAX_BATCHES) — stopping."
            exit 0
          fi
          echo "Batch $CURRENT_BATCH hit threshold. Triggering Batch $NEXT_BATCH..."
          gh workflow run scraper.yml --ref main -f batch="$NEXT_BATCH"
          sleep 5

      - name: Cleanup on Cancel
        if: cancelled()
        run: echo "🛑 Workflow was cancelled — reboot skipped."
