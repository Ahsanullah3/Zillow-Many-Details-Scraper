name: 🚀 Stealth Scraper V6

run-name: 🚀 Stealth Scraper V6 (Batch ${{ inputs.batch || '1' }})

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:
    inputs:
      batch:
        description: "The current batch number"
        required: false
        default: "1"
        type: string

permissions:
  actions: write
  contents: read

concurrency:
  group: zillow-scraper
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          # cache: 'npm'  <-- removed (no package-lock.json in repo)

      - name: Install Dependencies
        run: npm install
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'

      - name: Setup Google Chrome Build Engine
        id: setup-chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Run Scraper Engine
        id: scraper_task
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          PUPPETEER_EXECUTABLE_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: npm start

      - name: Evaluate Self-Reboot Sequence
        if: steps.scraper_task.outputs.has_more == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CURRENT_BATCH="${{ inputs.batch || '1' }}"
          NEXT_BATCH=$((CURRENT_BATCH + 1))

          echo "Batch $CURRENT_BATCH threshold hit. Rotating environment and triggering Batch $NEXT_BATCH..."

          gh workflow run scraper.yml --ref main -f batch=$NEXT_BATCH
          sleep 5
