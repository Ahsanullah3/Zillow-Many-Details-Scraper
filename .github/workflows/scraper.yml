name: 🚀 Edge Scraper V6

run-name: 🚀 Edge Scraper V6 (Batch ${{ inputs.batch || '1' }})

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:
    inputs:
      batch:
        description: "Batch number"
        required: false
        default: "1"
        type: string

permissions:
  actions: write
  contents: read

concurrency:
  group: zillow-scraper
  cancel-in-progress: false

env:
  MAX_BATCHES: "40"          # hard cap so a persistent block can't loop forever
  BLOCK_COOLDOWN_SEC: "300"  # wait this long before retrying after a block

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 25       # room for scrape (~6 min) + cooldown

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Setup Edge (Latest Dev)
        id: setup-edge
        uses: browser-actions/setup-edge@v1
        with:
          edge-version: 'dev'

      - name: Run Scraper
        id: scraper_task
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          PUPPETEER_EXECUTABLE_PATH: ${{ steps.setup-edge.outputs.edge-path }}
        run: npm start

      # Runs ONLY if the job is still healthy: not cancelled, not failed,
      # not timed out, and the scraper reported more rows.
      - name: Evaluate Self-Reboot
        if: ${{ !cancelled() && success() && steps.scraper_task.outputs.has_more == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CURRENT_BATCH: ${{ inputs.batch || '1' }}
          WAS_BLOCKED: ${{ steps.scraper_task.outputs.blocked }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if ! [[ "$CURRENT_BATCH" =~ ^[0-9]+$ ]]; then CURRENT_BATCH=1; fi
          NEXT_BATCH=$((CURRENT_BATCH + 1))

          if [ "$NEXT_BATCH" -gt "$MAX_BATCHES" ]; then
            echo "Reached MAX_BATCHES ($MAX_BATCHES). Stopping chain; cron will resume later."
            exit 0
          fi

          if [ "$WAS_BLOCKED" = "true" ]; then
            echo "Blocked — cooling down ${BLOCK_COOLDOWN_SEC}s before next batch"
            sleep "$BLOCK_COOLDOWN_SEC"
          fi

          echo "Batch $CURRENT_BATCH → Batch $NEXT_BATCH"
          gh workflow run scraper.yml --ref "$REF_NAME" -f batch="$NEXT_BATCH"
